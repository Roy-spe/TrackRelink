[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trackrelink"
version = "0.1.0"
description = "Learned offline tracklet repair with fixed detections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<3", "scipy>=1.9,<2", "scikit-learn>=1.1,<2"]

[project.scripts]
trackrelink = "trackrelink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
